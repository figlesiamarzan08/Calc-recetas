<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Recetas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { color: #2c3e50; }
    label { display: block; margin-top: 10px; }
    input { margin-top: 5px; padding: 5px; width: 150px; }
    button { margin-top: 15px; padding: 10px; background: #27ae60; color: white; border: none; cursor: pointer; }
    button:hover { background: #2ecc71; }
    .resultado { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Calculadora de Recetas</h2>

  <label>Peso total de la receta (g):</label>
  <input type="number" id="pesoTotal" placeholder="Ej: 1000">

  <label>% Harina:</label>
  <input type="number" id="harina" value="100">

  <label>% Agua:</label>
  <input type="number" id="agua" value="55">

  <label>% Grasa:</label>
  <input type="number" id="grasa" value="4">

  <label>% Sal:</label>
  <input type="number" id="sal" value="2">

  <label>% Levadura:</label>
  <input type="number" id="levadura" value="1.5">

  <label>% Azúcar:</label>
  <input type="number" id="azucar" value="8">

  <button onclick="calcular()">Calcular</button>

  <div class="resultado" id="resultado"></div>

  <script>
    function calcular() {
      let pesoTotal = parseFloat(document.getElementById("pesoTotal").value);

      let harina = (document.getElementById("harina").value/100) * pesoTotal;
      let agua = (document.getElementById("agua").value/100) * pesoTotal;
      let grasa = (document.getElementById("grasa").value/100) * pesoTotal;
      let sal = (document.getElementById("sal").value/100) * pesoTotal;
      let levadura = (document.getElementById("levadura").value/100) * pesoTotal;
      let azucar = (document.getElementById("azucar").value/100) * pesoTotal;

      document.getElementById("resultado").innerHTML =
        "Harina: " + harina.toFixed(2) + " g<br>" +
        "Agua: " + agua.toFixed(2) + " ml<br>" +
        "Grasa: " + grasa.toFixed(2) + " g<br>" +
        "Sal: " + sal.toFixed(2) + " g<br>" +
        "Levadura: " + levadura.toFixed(2) + " g<br>" +
        "Azúcar: " + azucar.toFixed(2) + " g";
    }
  </script>
</body>
</html>
